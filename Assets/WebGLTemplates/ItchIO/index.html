<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; color: #fff; font: 16px sans-serif; }
    #player { position: relative; width: min(100vw, 177.777778vh); aspect-ratio: 16 / 9; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #10131a; text-align: center; }
    progress { width: min(65%, 360px); height: 18px; accent-color: #c9d8ef; }
    #error { max-width: 80%; line-height: 1.5; }
  </style>
</head>
<body>
  <main id="player">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="Sudoku procedural"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <span id="message">Cargando Sudoku…</span>
      <progress id="progress" max="1" value="0" aria-label="Carga del juego"></progress>
      <span id="error" hidden></span>
    </div>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    function showError(message) {
      loading.style.display = 'flex';
      document.querySelector('#message').textContent = 'No se pudo iniciar el juego.';
      document.querySelector('#progress').hidden = true;
      const error = document.querySelector('#error');
      error.hidden = false;
      error.textContent = String(message);
    }
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: (message, type) => { if (type === 'error') showError(message); else console.warn(message); }
    };
    const script = document.createElement('script');
    script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    script.onerror = () => showError('No se encontró el cargador. Recarga la página e inténtalo otra vez.');
    script.onload = () => {
      createUnityInstance(canvas, config, value => {
        document.querySelector('#progress').value = value;
      }).then(() => {
        loading.style.display = 'none';
        canvas.focus();
      }).catch(showError);
    };
    canvas.addEventListener('pointerdown', () => canvas.focus());
    document.body.appendChild(script);
  </script>
</body>
</html>
